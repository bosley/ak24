<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="440" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0033cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-light">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#grad1-light)" stroke-width="2" opacity="0.2"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#grad1-light)" stroke-width="1.5" opacity="0.15"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="url(#grad1-light)" stroke-width="1" opacity="0.1"/>

  <g filter="url(#glow-light)">
    <text x="200" y="180" font-family="monospace, 'Courier New'" font-size="72" font-weight="bold"
          fill="url(#grad1-light)" text-anchor="middle" letter-spacing="4">AK24</text>
  </g>

  <text x="200" y="240" font-family="monospace, 'Courier New'" font-size="18"
        fill="#0066ff" text-anchor="middle" letter-spacing="8" opacity="0.7">APPLICATION KERNEL</text>

  <g stroke="url(#grad1-light)" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 80 200 L 120 200" stroke-linecap="round"/>
    <path d="M 280 200 L 320 200" stroke-linecap="round"/>
    <path d="M 200 80 L 200 120" stroke-linecap="round"/>
    <path d="M 200 280 L 200 320" stroke-linecap="round"/>
  </g>

  <g fill="url(#grad1-light)" opacity="0.7">
    <circle cx="80" cy="200" r="4"/>
    <circle cx="320" cy="200" r="4"/>
    <circle cx="200" cy="80" r="4"/>
    <circle cx="200" cy="320" r="4"/>
  </g>

  <g stroke="#0066ff" stroke-width="1" fill="none" opacity="0.25">
    <polygon points="200,140 220,160 200,180 180,160"/>
    <polygon points="200,220 220,240 200,260 180,240"/>
  </g>

  <text x="200" y="420" font-family="monospace, 'Courier New'" font-size="14"
        fill="#0066ff" text-anchor="middle" opacity="0.6">v0.1.0-dev</text>
</svg>

